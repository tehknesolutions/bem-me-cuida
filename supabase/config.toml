project_id = "bemmecuida"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "bemmecuida-dev://auth/callback"
additional_redirect_urls = [
  "bemmecuida-dev://auth/callback",
  "bemmecuida-preview://auth/callback",
  "bemmecuida://auth/callback",
  "bemmecuida-dev://reset-password",
  "bemmecuida-preview://reset-password",
  "bemmecuida://reset-password",
  "exp://127.0.0.1:8081/**",
  "exp://localhost:8081/**"
]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_confirmations = true
